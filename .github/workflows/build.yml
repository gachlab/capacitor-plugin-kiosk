name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint + build + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  android:
    name: Android — unit + integration + e2e
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 20
    needs: web
    env:
      JAVA_HOME: /Users/gcarrillo/.local/share/mise/installs/java/zulu-21.46.19.0
      ANDROID_HOME: /Users/gcarrillo/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/gcarrillo/Library/Android/sdk
    steps:
      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon
      - run: npm run build
      - name: Install example-app dependencies
        working-directory: example-app
        run: npm ci
      - name: Sync plugin into example Android project
        working-directory: example-app
        run: npx cap sync android
      - name: Build example APK
        working-directory: example-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build instrumented test APK
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest --no-daemon
      - name: Integration + E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          profile: Nexus 6
          avd-name: android-e2e
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim
          enable-hw-acceleration: true
          script: >-
            .github/scripts/integration-kiosk.sh &&
            .github/scripts/e2e-kiosk.sh
      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-logcat
          path: /tmp/e2e-logcat.txt
